<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Music Visualizer</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#02000C">

    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./service-worker.js")
          .then(() => console.log("Service Worker Registered"));
      }
    </script>
</head>

<body>

<header>
    <h1>Echoes Of Emotion</h1>
</header>

<ul class="topnav">
    <li>
        <a href="./index.html">
            <img src="./icons/home.png" style="width:40px;height:40px;">
        </a>
    </li>

    <li>
        <a href="./Settings.html">
            <img src="./icons/settings.png" style="width:40px;height:40px;">
        </a>
    </li>
</ul>

<!-- CANVAS -->
<div id="canvas-container"></div>

<!-- CONTROLS SECTION -->
<div id="controls">
    <label>Live Emotion Detection Visualizer</label>
    <button id="listenBtn">Start Listening 🎤</button>

    <div id="info"></div>
    <div id="emotion-display">
        Press "Start Listening" to analyze live audio
    </div>
</div>

<!-- LOAD THREE -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<!-- LOAD JS FILE -->
<script src="script.js"></script>

</body>
</html>
