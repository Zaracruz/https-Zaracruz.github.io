<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Music Visualizer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#02000C">
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./service-worker.js")
          .then(() => console.log("Service Worker Registered"));
      }
    </script>
</head>
<body>
 
<nav class="topnav">
     <div class="nav-left"></div>

                <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
        </a>
        <a href="./Settings.html" class="nav-link" title="Settings">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

        <a href="./info.html" class="nav-link" title="Info">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" 
                stroke="currentColor" stroke-width="2" 
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="16" x2="12" y2="12"/>
                <line x1="12" y1="8" x2="12.01" y2="8"/>
            </svg>
        </a>
    <a href="#" class="nav-link" id="emotionBtn" title="Emotion">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            
            <!-- Face -->
            <circle cx="12" cy="12" r="10"/>
            
            <!-- Eyes -->
            <line x1="9" y1="10" x2="9.01" y2="10"/>
            <line x1="15" y1="10" x2="15.01" y2="10"/>
            
            <!-- Smile -->
            <path d="M8 15c1.5 1.5 6.5 1.5 8 0"/>
        </svg>

    </div>
</nav>
 
<div id="canvas-container" style="width: 100vw; height: 100vh;"></div>
 
<div id="controls">
    <label>Live Emotion Detection Visualizer</label>
    <button id="listenBtn">Start Listening..</button>
    <div class="upload-wrapper">
    <label for="fileInput" class="upload-btn">
         Upload Audio File
    </label>
    <input type="file" id="fileInput" hidden>
    <div id="upload-status">No file selected</div>
</div>
    <div id="info"></div>
    <div id="emotion-display">Press "Start Listening" to analyze live audio</div>
</div>

</div>

<div id="visualiser" class="visualiser"></div>
 
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="script.js"></script>

<div id="emotionPopup" class="popup hidden">
    <div class="popup-content">

        <select id="emotionMode">
            <option value="auto">Auto Detection</option>
            <option value="manual">Manual</option>
        </select>

        <button data-emotion="happy">Happy</button>
        <button data-emotion="sad">Sad</button>
        <button data-emotion="energetic">Energetic</button>
        <button data-emotion="upbeat">Upbeat</button>

    </div>
</div>

  </div>
</div>

</body>
</html>
