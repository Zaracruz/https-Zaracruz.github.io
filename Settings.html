            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"/>

<div class="settings-container">
    <div class="setting-row">
    <div class="setting-text">
        <h2>Bars</h2>
        <p>Emotion bar visualizer</p>
    </div>
    <label class="switch">
        <input type="radio" name="visual" value="bars" id="bars">
        <span class="slider"></span>
    </label>
</div>

<div class="setting-row">
    <div class="setting-text">
        <h2>Wave</h2>
        <p>Smooth waveform</p>
    </div>
    <label class="switch">
        <input type="radio" name="visual" value="wave" id="wave">
        <span class="slider"></span>
    </label>
</div>

<div class="setting-row">
    <div class="setting-text">
        <h2>Circular</h2>
        <p>Blob / radial style</p>
    </div>
    <label class="switch">
        <input type="radio" name="visual" value="circular" id="circular">
        <span class="slider"></span>
    </label>
</div>

</div>
 
<script src="script.js"></script>
 
</body>
</html>
